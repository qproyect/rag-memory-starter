services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_memory_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_memory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_memory_app
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rag_memory
      PRIMARY_LLM_PROVIDER: mock
      FALLBACK_LLM_PROVIDERS: mock
      PROVIDER_TIMEOUT_MS: 5000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
